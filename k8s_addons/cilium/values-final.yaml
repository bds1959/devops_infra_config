bpf:
  hostLegacyRouting: false
cluster:
  name: kubernetes
cni:
  customConf: false
  uninstall: false
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
    - 10.200.0.0/16
k8sServiceHost: 172.16.1.240
k8sServicePort: 6443
kubeProxyReplacement: true
operator:
  replicas: 1
  unmanagedPodWatcher:
    restart: true
policyEnforcementMode: default
routingMode: tunnel
tunnelPort: 8473
tunnelProtocol: vxlan


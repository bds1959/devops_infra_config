apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apptest-gateway
  namespace: ingress-system
spec:
  gatewayClassName: cilium
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: apptest.banyancloud.io
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: banyan-io
    allowedRoutes:
      namespaces:
        from: All

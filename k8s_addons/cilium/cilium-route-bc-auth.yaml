---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bc-auth-route
  namespace: bc-auth-ns
spec:
  parentRefs:
  - name: apptest-gateway
    namespace: ingress-system
  hostnames:
  - apptest.banyancloud.io
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /bcauth
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: bc-auth
      port: 5000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bc-encs-v1-route
  namespace: bc-encs-v1-ns
spec:
  parentRefs:
  - name: apptest-gateway
    namespace: ingress-system
  hostnames:
  - apptest.banyancloud.io
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /bcencs
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: bc-encs-v1
      port: 5001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: banyancloud-ui-route
  namespace: banyancloud-ui-ns
spec:
  parentRefs:
  - name: apptest-gateway
    namespace: ingress-system
  hostnames:
  - apptest.banyancloud.io
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: banyancloud-ui
      port: 80

apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: trace-tcp-connect
spec:
  # Pod selector: Limits policy to pods in "default" namespace
  podSelector:
    matchExpressions:
      - key: kubernetes.namespace.name  # Or use app labels if needed
        operator: In
        values:
          - default
  kprobes:
    - call: tcp_connect
      syscall: false
      args:
        - index: 0
          type: sock  # Extracts socket details (IP, port) for events
      selectors:
        # Minimal selector to enable tracing; add matchArgs for filters (e.g., dport)
        - matchActions:
            - action: Post  # Emit event after successful connect
